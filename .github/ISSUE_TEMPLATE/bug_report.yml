name: Bug 反馈
description: 反馈识别错误、操作异常、程序崩溃或连接问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量完整地提供复现步骤、版本信息、日志和截图，方便定位问题。

        提交前请搜索 [活跃 Issue](https://github.com/NotZoruak/MATR/issues) 和 [已关闭 Issue](https://github.com/NotZoruak/MATR/issues?q=is%3Aissue%20state%3Aclosed)，避免重复提交。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这是 Bug 反馈，而不是功能建议或一般咨询。
          required: true
        - label: 我使用的是当前可获取的最新版本，并确认问题仍然存在。
          required: true
        - label: 我已搜索活跃和已关闭 Issue，确认没有相同问题。
          required: true
        - label: 我已检查日志、截图和配置，不包含账号、密钥等敏感信息。
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清楚说明发生了什么，以及问题出现时模拟器画面处于什么状态。
      placeholder: 例如：运行常驻作战时，模拟器停留在“部队编成”画面，MATR 一直等待，没有继续点击。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请从任务开始前的状态写起，按顺序列出操作和相关设置。
      placeholder: |
        1. 启动 MATR 并连接模拟器
        2. 选择……任务，设置……选项
        3. 点击“开始任务”
        4. 进入……画面后出现问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 正常情况下，你认为程序应该如何运行？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？请包含画面状态、程序提示、是否点击以及是否需要重启等信息。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MATR 版本
      description: 请填写程序窗口标题或发布包中的完整版本号。
      placeholder: 例如：v0.14.3-beta.4
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: 环境与配置信息
      description: 请填写操作系统、模拟器或设备、分辨率、DPI、连接方式、涉及任务及非默认选项。
      placeholder: |
        操作系统：Windows 11 24H2，x64
        模拟器或设备：MuMu 模拟器 12，版本……
        分辨率与 DPI：1280×720，240 DPI
        连接方式：自动检测 / ADB 地址 / 其他
        涉及任务：常驻作战 / 本丸后勤 / ……
        非默认配置：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志和配置文件
      description: 请上传导出的日志压缩包，或直接拖入 `debug/maafw.log` 和相关文件。无法提供时请说明原因。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 识别、点击或画面流程问题请提供无遮挡的完整模拟器画面，最好包含问题发生前后的画面。请不要只上传带窗口边框的聊天软件截图。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他补充信息
      description: 可填写临时解决方法、相关 Issue、异常出现前后的操作或其他线索。
    validations:
      required: false
