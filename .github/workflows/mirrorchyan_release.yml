name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    types: [published]

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'NotZoruak' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x86_64
            filename: 'MATR-*-win-x64.zip'
          - os: macos
            arch: aarch64
            filename: 'MATR-*-macos-arm64.zip'

    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: MATR
          # 自动触发时取当前 release 的 tag，避免 action 自行推断到「最新」tag；
          # 手动派发时 inputs.tag 优先，留空才回退到默认行为。
          tag: ${{ inputs.tag || github.event.release.tag_name }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: NotZoruak
          repo: MATR
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
