name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
        tag:
            default: ''
            required: false
  release:
    types: [published, edited]

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'NotZoruak' }}
    runs-on: macos-latest

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MATR
          # 与 mirrorchyan_release.yml 保持一致：自动触发时取当前 release 的 tag，
          # 手动派发时 inputs.tag 优先，留空才回退到默认行为。
          version_name: ${{ inputs.tag || github.event.release.tag_name }}

          owner: NotZoruak
          repo: MATR
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
